[package]
name = "patchbukkit"
version = "0.1.0"
edition = "2024"
authors = ["PumpkinMC Contributors"]
description = "Compatibility layer for running Bukkit, Spigot, and Paper plugins on Pumpkin"

build = "build/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Native ABI 7 must match the server revision used for this compatibility build.
pumpkin = { git = "https://github.com/Alb11747/Pumpkin.git", rev = "b5dc35f0275514ed4185a0d6d5542d131f2892f9", package = "pumpkin-core" }
pumpkin-data = { git = "https://github.com/Alb11747/Pumpkin.git", rev = "b5dc35f0275514ed4185a0d6d5542d131f2892f9", package = "pumpkin-data" }
pumpkin-protocol = { git = "https://github.com/Alb11747/Pumpkin.git", rev = "b5dc35f0275514ed4185a0d6d5542d131f2892f9", package = "pumpkin-protocol" }
pumpkin-util = { git = "https://github.com/Alb11747/Pumpkin.git", rev = "b5dc35f0275514ed4185a0d6d5542d131f2892f9", package = "pumpkin-util" }
pumpkin-config = { git = "https://github.com/Alb11747/Pumpkin.git", rev = "b5dc35f0275514ed4185a0d6d5542d131f2892f9", package = "pumpkin-config" }
pumpkin-api-macros = { git = "https://github.com/Alb11747/Pumpkin.git", rev = "b5dc35f0275514ed4185a0d6d5542d131f2892f9", package = "pumpkin-api-macros" }

tokio = "1"
tracing = "0.1"
glob = "0.3.4"
jni = { version = "0.22.4", features = ["invocation"] }
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path", "debug-embed"] }
walkdir = "2"
zip = "8.6"

anyhow = "1.0"
uuid = "1.26.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "1.3.0"

rand = { git = "https://github.com/rust-random/rand"}
prost = "0.14"
time = "0.3"

toml = "1.1"

[dev-dependencies]
tempfile = "3"
arc-swap = "1.9"
tracing-subscriber = "0.3"

[build-dependencies]
env_logger = "0.11.11"
log = "0.4"
prost-build = "0.14"
protoc-bin-vendored = "3"
glob = "0.3"

[profile.release]
lto = false
codegen-units = 16

[profile.dev]
debug = false

[lints.clippy]
# Groups
all = { level = "deny", priority = -1 }
# nursery = { level = "deny", priority = -1 }
# pedantic = { level = "deny", priority = -1 }
# cargo = { level = "deny", priority = -1 }

multiple_crate_versions = "allow"
unnecessary_fallible_conversions = "allow"
not_unsafe_ptr_arg_deref = "allow" # Not sure about this one
